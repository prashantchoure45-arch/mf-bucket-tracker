name: Build MF Bucket Tracker V24 All Problems Rebalancing

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V24 project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'MF_Bucket_Tracker_v24_All_Problems_Rebalancing.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "V24 ZIP not found"
            exit 1
          fi
          rm -rf build-v24
          mkdir -p build-v24
          unzip -q "$ZIP" -d build-v24
          PROJECT="$(find build-v24 -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V24 debug APK
        working-directory: ${{ env.PROJECT }}
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e
          APK="$(find "${PROJECT}/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V24.apk"

      - name: Upload V24 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V24-All-Problems-Rebalancing-APK
          path: MF-Bucket-Tracker-V24.apk
