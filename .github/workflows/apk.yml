name: Build MF Bucket Tracker V37 Fixed Rebalancing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V37 Project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f \
            -name 'MF_Bucket_Tracker_V37_Fixed_Rebalancing.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "V37 ZIP नहीं मिला"
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          PROJECT_DIR=$(find build-project -type f -name settings.gradle \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project नहीं मिला"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build V37 Fixed Rebalancing APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "${{ env.PROJECT_DIR }}" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK नहीं मिला"
            exit 1
          fi

          echo "APK: $APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V37-Fixed-Rebalancing.apk"

      - name: Upload V37 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V37-Fixed-Rebalancing
          path: MF-Bucket-Tracker-V37-Fixed-Rebalancing.apk
