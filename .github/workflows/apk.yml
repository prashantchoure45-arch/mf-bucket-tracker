name: Build MF Bucket Tracker v21 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract v21 project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name 'MF_Bucket_Tracker_v21_*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "v21 ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP" -d build-source

          PROJECT=$(find build-source -type f -name settings.gradle -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT/gradlew" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name '*.apk' | head -1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload v21 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-v21-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
