name: Build MF Bucket Tracker V35 Full Article Fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V35 project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 4 -type f -name 'MF_Bucket_Tracker_V35_Full_Article_Fix.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "V35 ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf build-v35
          mkdir -p build-v35
          unzip -q "$ZIP" -d build-v35

          PROJECT="$(find build-v35 -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V35 Debug APK
        working-directory: ${{ env.PROJECT }}
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "${PROJECT}/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V35.apk"

      - name: Upload V35 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V35-Full-Article-Fix-APK
          path: MF-Bucket-Tracker-V35.apk
