name: Build MF Bucket Tracker V39 Rebalancing

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract V39 ZIP
        shell: bash
        run: |
          echo "Searching for V39 Rebalancing ZIP..."

          ZIP=$(find . -type f \
            \( -iname '*V39*Rebalancing*.zip' -o -iname '*LOCKED*REBALANCING*.zip' \) \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V39 Rebalancing ZIP not found!"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 4 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find build-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo "Searching for Gradle files..."
            find build-project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Android Project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle Executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build V39 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK FOUND: $APK"

          mkdir -p apk-output
          cp "$APK" apk-output/MF_Bucket_Tracker_V39_Rebalancing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MF_Bucket_Tracker_V39_Rebalancing_APK
          path: apk-output/MF_Bucket_Tracker_V39_Rebalancing.apk
          if-no-files-found: error
