name: Build MF Bucket Tracker V33 News NAV FD Calculator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V33 project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 4 -type f -name 'MF_Bucket_Tracker_V33_News_NAV_FD_Calculator.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "V33 ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf build-v33
          mkdir -p build-v33

          unzip -q "$ZIP" -d build-v33

          PROJECT="$(find build-v33 -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V33 Debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "${PROJECT}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK found: $APK"

          cp "$APK" "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V33.apk"

      - name: Upload V33 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V33-News-NAV-FD-Calculator-APK
          path: MF-Bucket-Tracker-V33.apk
