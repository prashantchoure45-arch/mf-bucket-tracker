
name: Build MF Bucket Tracker V101 H&E APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack V101 source ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'MF_Bucket_Tracker_V101_HE_SOURCE_READY.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V101 source ZIP not found in repository root."
            exit 1
          fi

          mkdir -p source-unpacked
          unzip -q "$ZIP_FILE" -d source-unpacked

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find source-unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Find and prepare APK
        shell: bash
        run: |
          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_PATH" apk-output/MF_Bucket_Tracker_V101_HE_APK.apk
          ls -lh apk-output/MF_Bucket_Tracker_V101_HE_APK.apk

      - name: Upload V101 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF_Bucket_Tracker_V101_HE_APK
          path: apk-output/MF_Bucket_Tracker_V101_HE_APK.apk
          if-no-files-found: error
