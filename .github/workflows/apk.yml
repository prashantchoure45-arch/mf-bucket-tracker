name: Build MF Bucket Tracker v22 Multi Profile News Guide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find exact V22 ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -name 'MF_Bucket_Tracker_v22_MultiProfile_News_Guide.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Exact V22 ZIP not found"
            echo "Available V22 ZIP files:"
            find . -maxdepth 1 -type f -name '*v22*.zip' -print
            exit 1
          fi

          echo "Using EXACT ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V22 project
        shell: bash
        run: |
          set -e

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_PATH" -d build-source

          PROJECT=$(find build-source -type f -name settings.gradle -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            find build-source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT=$(dirname "$PROJECT")

          echo "Android project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify V22 project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

          echo "V22 project verification passed."

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT/gradlew" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT" -type f -path '*/build/outputs/apk/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK built: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload V22 Final APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-v22-MultiProfile-News-Guide-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
