name: Build MF Bucket Tracker v20 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract v20 project
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'MF_Bucket_Tracker_v20_Dedicated_Pages_Fixed.zip' \
            -o -name '*v20*Dedicated*Pages*Fixed*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "v20 ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf build-source
          mkdir build-source

          unzip -q "$ZIP" -d build-source

          PROJECT=$(find build-source -name settings.gradle -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Project: $PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT/gradlew" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          find "$PROJECT" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-v20-APK
          path: |
            ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
