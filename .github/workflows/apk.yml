name: Build MF Bucket Tracker V27

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V27 project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 3 -type f \
            -name 'MF_Bucket_Tracker_v27_Bucket_Allocation_Rebalance_Fixed.zip' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "V27 ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP"

          rm -rf build-v27
          mkdir -p build-v27

          unzip -q "$ZIP" -d build-v27

          PROJECT="$(find build-v27 -type f \
            -name settings.gradle \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" | tee "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V27 Debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "${PROJECT}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V27.apk"

      - name: Upload V27 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V27-APK
          path: MF-Bucket-Tracker-V27.apk
