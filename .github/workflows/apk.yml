name: Build MF Bucket Tracker V40 REAL Rebalancing

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V40 Rebalancing ZIP
        shell: bash
        run: |
          echo "Searching for V40 Rebalancing ZIP..."

          ZIP=$(find . -type f \
            \( \
              -iname '*V40*REAL*REBALANCING*FIXED*.zip' \
              -o -iname '*V40*Rebalancing*.zip' \
            \) \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V40 Rebalancing ZIP NOT FOUND!"
            echo ""
            echo "ZIP files available in repository:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "FOUND: $ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo ""
          echo "EXTRACTED FILES:"
          find build-project -maxdepth 4 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find build-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project NOT FOUND!"
            echo ""
            echo "Gradle files found:"
            find build-project -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle Wrapper Executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No gradlew found. System Gradle will be used."
          fi

      - name: Build V40 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "BUILDING V40 REAL REBALANCING APK..."

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Find Generated APK
        shell: bash
        run: |
          echo "Searching generated APK..."

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was NOT generated!"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/MF_Bucket_Tracker_V40_REAL_REBALANCING.apk

      - name: Upload V40 APK
        uses: actions/upload-artifact@v4
        with:
          name: MF_Bucket_Tracker_V40_REAL_REBALANCING_APK
          path: apk-output/MF_Bucket_Tracker_V40_REAL_REBALANCING.apk
          if-no-files-found: error
