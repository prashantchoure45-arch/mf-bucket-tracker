name: Build MF Bucket Tracker V36 Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V35 project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 4 -type f -name 'MF_Bucket_Tracker_V35_Full_Article_Fix.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "V35 ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf build-v35
          mkdir -p build-v35
          unzip -q "$ZIP" -d build-v35

          PROJECT="$(find build-v35 -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT/app/mf-release.jks"

          if [ ! -s "$PROJECT/app/mf-release.jks" ]; then
            echo "Keystore was not created"
            exit 1
          fi

          echo "Permanent signing keystore restored"

      - name: Configure signed release
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "One or more signing secrets are missing"
            exit 1
          fi

          cat >> "$PROJECT/app/build.gradle" <<'EOF'

          // MF Bucket Tracker V36 permanent signing configuration
          android {
              defaultConfig {
                  versionCode 36
                  versionName "36.0"
              }

              signingConfigs {
                  release {
                      storeFile file("mf-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          echo "Signed release configuration added"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V36 Signed Release APK
        working-directory: ${{ env.PROJECT }}
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "${PROJECT}/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Signed release APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/MF-Bucket-Tracker-V36-Signed.apk"

      - name: Upload V36 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Bucket-Tracker-V36-Signed
          path: MF-Bucket-Tracker-V36-Signed.apk
