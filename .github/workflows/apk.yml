name: Build MF Bucket Tracker V37 Fill Rebalance FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract V37 Fill Rebalance ZIP
        shell: bash
        run: |
          echo "Searching for V37 Fill Rebalance ZIP..."

          ZIP=$(find . -type f \
            -iname '*V37*Fill*Rebalance*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V37 Fill Rebalance ZIP NOT FOUND!"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "FOUND: $ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find build-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"

            find build-project -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          echo "Android Project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle Executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build V37 Fill Rebalance FIXED APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Building V37 Fill Rebalance FIXED APK..."

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK FOUND: $APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/MF_Bucket_Tracker_V37_FILL_REBALANCE_FIXED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MF_Bucket_Tracker_V37_FILL_REBALANCE_FIXED_APK
          path: apk-output/MF_Bucket_Tracker_V37_FILL_REBALANCE_FIXED.apk
          if-no-files-found: error
